<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Task Manager - CRUD App</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Nunito:400,700&display=swap');

    :root {
      --primary: #5f72bd;
      --secondary: #9c27b0;
      --success: #43e97b;
      --danger: #ff5858;
      --bg: #f6f7fb;
      --card: #fff;
      --shadow: 0 8px 24px rgba(60, 72, 88, 0.12);
      --radius: 18px;
      --transition: 0.3s cubic-bezier(.25, .8, .25, 1);
    }

    * {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px 40px 28px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 1.2s;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-40px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 18px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    #task-input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 1rem;
      transition: border-color var(--transition);
    }

    #task-input:focus {
      border-color: var(--secondary);
    }

    #add-btn {
      padding: 12px 18px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(92, 90, 227, 0.08);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    #add-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 20px rgba(92, 90, 227, 0.18);
    }

    #task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      margin-bottom: 12px;
      padding: 14px 12px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(60, 72, 88, 0.08);
      animation: taskAppear 0.7s;
      position: relative;
    }

    @keyframes taskAppear {
      0% {
        opacity: 0;
        transform: translateX(-40px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .task-text {
      flex: 1;
      font-size: 1.09rem;
      color: #23235b;
      word-break: break-word;
      transition: color var(--transition);
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #a3a3a3;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-left: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform var(--transition);
      outline: none;
    }

    .btn-edit {
      background: #e5d2fa;
      color: var(--secondary);
    }

    .btn-edit:hover {
      background: var(--secondary);
      color: #fff;
      transform: scale(1.1);
    }

    .btn-delete {
      background: #ffe5e5;
      color: var(--danger);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
      transform: scale(1.1) rotate(-6deg);
    }

    .btn-complete {
      background: #e8ffef;
      color: var(--success);
    }

    .btn-complete:hover {
      background: var(--success);
      color: #fff;
      transform: scale(1.1) rotate(6deg);
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px 6px 28px 6px;
        max-width: 99vw;
      }

      .task-item {
        padding: 10px 3px;
        font-size: 0.97rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Task Manager</h1>
    <form id="task-form" autocomplete="off">
      <input type="text" id="task-input" placeholder="Enter a new task" required>
      <button type="submit" id="add-btn">Add Task</button>
    </form>
    <ul id="task-list"></ul>
  </div>
  <script>
    // CRUD Task Manager with animations and localStorage persistence

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');

    // Retrieve tasks from localStorage or start with an empty array
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    // Render all tasks
    function renderTasks() {
      taskList.innerHTML = '';
      if (tasks.length === 0) {
        taskList.innerHTML = `<li style="text-align:center;color:#999;font-size:1rem;">No tasks yet. Add one!</li>`;
        return;
      }
      tasks.forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = `task-item${task.completed ? ' completed' : ''}`;
        li.setAttribute('data-index', idx);

        li.innerHTML = `
      <span class="task-text">${escapeHTML(task.text)}</span>
      <span class="task-actions">
        <button class="btn btn-complete" title="Complete">${task.completed ? 'Undo' : 'Done'}</button>
        <button class="btn btn-edit" title="Edit">Edit</button>
        <button class="btn btn-delete" title="Delete">Delete</button>
      </span>
    `;
        taskList.appendChild(li);
      });
    }

    // Helper to escape HTML (security)
    function escapeHTML(str) {
      return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Save tasks to localStorage
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // Add Task
    taskForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const value = taskInput.value.trim();
      if (value) {
        tasks.unshift({ text: value, completed: false });
        saveTasks();
        renderTasks();
        taskInput.value = '';
        taskInput.focus();
      }
    });

    // Handle Task actions (event delegation)
    taskList.addEventListener('click', function (e) {
      const li = e.target.closest('.task-item');
      if (!li) return;
      const idx = Number(li.getAttribute('data-index'));

      // Complete/Undo
      if (e.target.classList.contains('btn-complete')) {
        tasks[idx].completed = !tasks[idx].completed;
        saveTasks();
        renderTasks();
      }

      // Edit
      if (e.target.classList.contains('btn-edit')) {
        const newText = prompt('Edit your task:', tasks[idx].text);
        if (newText !== null && newText.trim() !== '') {
          tasks[idx].text = newText.trim();
          saveTasks();
          renderTasks();
        }
      }

      // Delete
      if (e.target.classList.contains('btn-delete')) {
        if (confirm('Are you sure you want to delete this task?')) {
          // Animation before removing
          li.style.transition = 'opacity 0.4s, transform 0.4s';
          li.style.opacity = '0';
          li.style.transform = 'translateX(42px)';
          setTimeout(() => {
            tasks.splice(idx, 1);
            saveTasks();
            renderTasks();
          }, 400);
        }
      }
    });

    // Initial render
    renderTasks();
  </script>
</body>

</html>
