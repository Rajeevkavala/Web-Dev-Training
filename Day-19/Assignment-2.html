<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form Assignment</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
    }

    h2 {
        margin-top: 30px;
        color: #333;
    }

    form {
        background-color: #fff;
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: inline-block;
        margin-top: 20px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
    }

    input[type="text"],
    input[type="email"],
    textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
    }

    button {
        background-color: #4f46e5;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #3730a3;
    }

    #formMessage {
        margin-top: 15px;
        font-weight: bold;
        color: green;
    }

    #jsonResponse {
        background-color: #eef2ff;
        padding: 10px;
        border-radius: 8px;
        max-width: 400px;
        text-align: left;
        margin-top: 15px;
        white-space: pre-wrap;
        font-size: 13px;
    }
</style>

</head>
<body>
    <center>
    <h2>Feedback Form</h2>
    <form id="feedbackForm" autocomplete="off">
        <label for="name">Name</label>
        <input type="text" id="name" name="name"><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" ></textarea><br>

        <button>Submit</button>
    </form>
    <div id="formMessage"></div>
    <pre id="jsonResponse"></pre>
</center>
    <script>
        const form = document.getElementById('feedbackForm');
        const formMessage = document.getElementById('formMessage');
        const jsonResponse = document.getElementById('jsonResponse');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            formMessage.textContent = '';
            jsonResponse.textContent = '';

            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            const data = { name, email, message };

            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.status === 201) {
                    formMessage.textContent = 'Feedback submitted successfully!';
                    jsonResponse.textContent = JSON.stringify(result, null, 2);
                    form.reset();
                } else {
                    formMessage.textContent = 'Submission failed. Please try again.';
                }
            }
            catch (error) {
                formMessage.textContent = 'Error: ' + error.message;
            }
        });
        
    </script>
</body>
</html>
