<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <label for="firstNum">First Number: </label>
        <input type="number" id="firstNum" placeholder="Enter first number">
        <label for="operation">operation</label>
        <select id="operation">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
            <option value="modulus">%</option>
        </select>
        <label for="secondNum">Second Number: </label>
        <input type="number" id="secondNum" placeholder="Enter second number">
        <button id="calculateBtn" onclick="cal()">Calculate</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
