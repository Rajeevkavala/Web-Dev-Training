<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TO-DO List</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <main id="todo-container">
      <header id="header">
        <h1><i class="fas fa-tasks"></i> To Do List</h1>
      </header>

      <section id="todo-form">
        <input
          type="text"
          class="input-item"
          name="input_box"
          id="input-box"
          placeholder="Add Task"
        />

        <button id="input-button" onclick="addTask()">
          <i class="fas fa-plus"></i> Add
        </button>
      </section>

      <section>
        <h2><i class="fas fa-list"></i> Task List</h2>
        <ul id="list-container"></ul>

        <div class="counter-container">
          <div id="task-counters">
            Completed: <span id="completed-counter">0</span> | Uncompleted:
            <span id="uncompleted-counter">0</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Made with <i class="fas fa-heart"></i> by Rajeev</p>
    </footer>

    <script type="text/javascript" src="todo.js"></script>
  </body>
</html>
