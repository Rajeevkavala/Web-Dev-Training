<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Temperature Converter</h1>
        <label for="celsius">Celsius:</label>
        <input type="number" id="celsius" placeholder="Enter Celsius">
        <button id="convertBtn" onclick="convertToFahrenheit()">Convert to Fahrenheit</button>
        <label for="fahrenheit">Fahrenheit:</label>
        <input type="number" id="fahrenheit" placeholder="Enter Fahrenheit">
        <button id="convertBackBtn" onclick="convertToCelsius()">Convert to Celsius</button>
        <div id="output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
